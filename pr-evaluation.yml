name: PR RAG Evaluation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'data/**'
      - 'requirements.txt'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run RAG Evaluation
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      run: |
        # Ensure data directories exist (if they are empty, this might be needed)
        mkdir -p data/10k
        # Run evaluation (this will automatically ingest PDFs in data/10k if chromadb is empty)
        python src/evaluate.py

    - name: Generate PR Comment
      id: pr_comment
      run: |
        COMMENT=$(python src/pr_comment.py)
        # Use a delimiter for multi-line output in GitHub Actions
        echo "comment<<EOF" >> $GITHUB_OUTPUT
        echo "$COMMENT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Post PR Comment
      uses: actions/github-script@v7
      env:
        COMMENT: ${{ steps.pr_comment.outputs.comment }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const commentBody = process.env.COMMENT;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: commentBody
          })
